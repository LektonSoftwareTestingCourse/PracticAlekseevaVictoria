name: CI Pipeline

# Каждый студент работает в своём отдельном репозитории (Practic{Имя}{Фамилия}).
# Это ЛЁГКИЙ пайплайн: он гоняется на каждый push и проверяет только линтеры,
# компиляцию Java-модулей и сборку frontend. Секреты и вход в registry не требуются.
#
# Тяжёлые проверки (docker build + smoke/e2e/load-smoke) вынесены в
# practice-run.yml и запускаются вручную через workflow_dispatch — см.
# docs/submission-guide.md. Так мы не расходуем Actions-минуты на docker-сборку
# при каждом коммите.
#
# Студенческие тесты не предназначены для слияния в main эталонного репозитория.
# PR — только для инфраструктурных изменений от преподавателей в эталонном репозитории.

on:
  push:
    branches:
    - '**'
    paths-ignore:
    - 'docs/**'
    - 'tz/**'
    - '**/*.md'
    - '**/*.puml'
    - '**/*.png'
  pull_request:
    branches: [ main ]
    paths:
    - 'services/**'
    - '.github/workflows/ci.yml'
    - 'docker-compose.yaml'
    - '.env.example'
    - 'docs/api/**'
    - 'scripts/smoke-test.sh'
    - 'scripts/smoke-test.ps1'
    - 'scripts/load-smoke.sh'
    - 'tz/**'

# Отменяем предыдущие незавершённые прогоны в том же репозитории/ветке.
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run pre-commit hooks
      uses: pre-commit/action@v3.0.1

  build-common:
    runs-on: ubuntu-latest
    needs: base-lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build common module
      run: mvn -f services/pom.xml -P common -pl common -am package

  java-services:
    runs-on: ubuntu-latest
    needs: [ base-lint, build-common ]

    strategy:
      matrix:
        service: [ gateway, switch, authorization, card-management, terminal-simulator, merchant-acquirer, transaction-logger ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run java linter
      run: mvn -f services/pom.xml -P${{ matrix.service }} checkstyle:check

    - name: Build services and run tests
      run: mvn -f services/pom.xml -P${{ matrix.service }} verify -Dcheckstyle.skip=true

    - name: Upload JaCoCo report
      if: ${{ always() && contains(fromJSON('["gateway", "switch", "authorization", "card-management"]'), matrix.service) }}
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-${{ matrix.service }}
        path: services/${{ matrix.service }}/target/site/jacoco/
        if-no-files-found: error

  frontend-dashboard:
    runs-on: ubuntu-latest
    needs: base-lint

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      working-directory: ./services/dashboard
      run: npm install

    - name: Run ESLint
      working-directory: ./services/dashboard
      run: npm run lint

    - name: Build frontend application
      working-directory: ./services/dashboard
      run: npm run build
